<!DOCTYPE html>
//Jessica Mengerjakan Fitur Change Password//

<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Alert Error -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Alert Sukses -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <div class="card shadow">
                <div class="card-body p-4">

                    <h5 class="card-title mb-4">Ganti Password</h5>

                    <form th:action="@{/change-password}" th:object="${changePasswordRequest}" method="post">

                        <!-- Password Lama -->
                        <div class="mb-3">
                            <label class="form-label">Password Lama</label>
                            <input type="password" class="form-control" th:field="*{oldPassword}" placeholder="Masukkan password lama" required>
                        </div>

                        <!-- Password Baru -->
                        <div class="mb-3">
                            <label class="form-label">Password Baru</label>
                            <input type="password" class="form-control" th:field="*{newPassword}" placeholder="Masukkan password baru" required>
                        </div>

                        <!-- Konfirmasi Password Baru -->
                        <div class="mb-3">
                            <label class="form-label">Konfirmasi Password Baru</label>
                            <input type="password" class="form-control" th:field="*{confirmNewPassword}" placeholder="Ulangi password baru" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Simpan Password</button>
                            <a th:href="@{/profile}" class="btn btn-secondary">Batal</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
